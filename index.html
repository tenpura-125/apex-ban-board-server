<!DOCTYPE html>
<html lang="ja">
<head>
    <script src="https://dstn.to"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX キャラクターBAN確認ツール</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #ff4e4e;
            font-size: 24px;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        /* --- BAN数カウンターのスタイル --- */
        .ban-counter {
            font-size: 18px;
            font-weight: bold;
            color: #cccccc;
            margin-bottom: 15px;
        }

        #counter-number {
            color: #ff4e4e; /* 数字の部分だけ目立つ赤色に */
            font-size: 24px;
            margin: 0 4px;
        }

        .reset-button {
            background-color: #ff4e4e;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .reset-button:hover { background-color: #e03d3d; }
        .reset-button:active { transform: scale(0.95); }

        /* --- ゲーム画面を再現する2段レイアウト --- */
        .game-screen {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 上段（アサルト、スカーミッシャー） */
        .row-top {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        /* 下段（リコン、サポート、コントローラー） */
        .row-bottom {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        /* クラスごとの枠 */
        .class-section {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 6px;
            min-width: 250px;
        }

        /* クラス名（枠の下線） */
        .class-title {
            font-weight: bold;
            font-size: 13px;
            margin-top: 8px;
            padding-top: 5px;
            text-align: center;
        }
        .assault { border-top: 3px solid #ff4e4e; color: #ff4e4e; }
        .skirmisher { border-top: 3px solid #ffb84d; color: #ffb84d; }
        .recon { border-top: 3px solid #b84dff; color: #b84dff; }
        .support { border-top: 3px solid #4da6ff; color: #4da6ff; }
        .controller { border-top: 3px solid #4dff88; color: #4dff88; }

        /* キャラクターの並び */
        .character-grid {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        /* キャラクターカード（枠） */
        .character-card {
            background-color: #1a1a1a;
            border: 2px solid #3d3d3d;
            width: 55px;  /* ゲーム画面に近い縦長比率に調整 */
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px; /* 文字がはみ出さないよう小さめ */
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            overflow: hidden; /* 画像が枠からはみ出ないようにする */
            position: relative;
        }

        /* カード内の画像スタイル */
        .character-card img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 枠線に合わせて画像を綺麗に収める */
        }

        .character-card:hover {
            border-color: #ffffff;
            z-index: 10;
            transform: scale(1.1);
        }

        /* BAN（灰色）状態 */
        .character-card.banned {
            border-color: #222222 !important;
            filter: grayscale(100%) brightness(30%); /* 画像ごと完全に暗い灰色にします */
        }

        /* --- 免責事項フッターのスタイル --- */
        .footer {
            margin-top: 60px;
            padding: 20px 0;
            border-top: 1px solid #222222;
            font-size: 11px;
            color: #666666;
            line-height: 1.6;
        }
        
         /* ① タイトルを太字にして目立たせ、上の要素との距離を離す */
        .ban-history-title {
            font-size: 18px; /* 15pxから拡大 */
            font-weight: 900; /* より太字に */
            color: #ff4e4e;
            margin-top: 20px; /* 上との距離を確保 */
            margin-bottom: 25px; /* 下（画像）との距離を確保 */
            letter-spacing: 2px;
        }

        /* ③ BAN履歴内の画像サイズを、上部のキャラ選択画像と同じサイズ（55px × 70px）にする */
        .history-item {
            position: relative;
            width: 55px;  /* 55pxに固定 */
            height: 70px; /* 70pxに固定 */
            background-color: #222;
            border: 2px solid #555; /* 上部と同じ2px幅に */
            border-radius: 4px;
            overflow: hidden;
        }
                /* ② 左から右に並べ、10人ごとに1段下げる（自動折り返し） */
        .ban-history-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            min-height: 90px;
            align-items: center;
            
            /* カード10枚＋隙間(gap)がぴったり収まる横幅に制限 */
            max-width: 670px; 
            margin: 0 auto; /* 中央寄せ */
        }
        
           /* BANされた順番の数字バッジ（画像の上に重ねる設定に変更） */
        .history-number {
            position: absolute;
            top: 2px;
            left: 2px;
            background-color: rgba(255, 78, 78, 0.9); /* 赤色の背景 */
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 1px 5px;
            border-radius: 3px;
            z-index: 2; /* 画像よりも手前に表示する */
            line-height: 1; /* 縦幅をコンパクトに */
        }
                /* --- ルーム管理エリアのスタイル --- */
        .room-manager {
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
            border-radius: 6px;
            padding: 15px;
            max-width: 600px;
            margin: 0 auto 20px auto;
            font-size: 14px;
        }

        .room-manager input {
            background-color: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            margin: 0 5px;
            width: 120px;
        }

        .room-btn {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .room-btn:hover {
            background-color: #444;
            border-color: #ff4e4e;
        }
        
        
        
    </style>
</head>
<body>

    <h1>APEX LEGENDS BAN/PICK BOARD</h1>

    <div class="room-manager">
        <div id="room-setup-view">
            <button class="room-btn" type="button" onclick="createRoom()">新しい部屋を作る</button>
            <span style="margin: 0 10px; color: #555;">または</span>
            <input type="text" id="join-room-id" placeholder="部屋番号 (1-9999)">
            <input type="password" id="join-room-pass" placeholder="パスワード">
            <button class="room-btn" type="button" onclick="joinRoom()">部屋に入る</button>
        </div>

        
        <div id="room-active-view" style="display: none;">
            現在の部屋: <span id="current-room-display" style="color: #ff4e4e; font-weight: bold; margin-right: 15px;">-</span>
            <!-- 【追加】部屋を作った本人にだけ表示されるパスワード枠 -->
            <span id="master-password-area" style="display: none; margin-right: 15px;">
                パスワード: <span id="current-pass-display" style="color: #ffb84d; font-weight: bold;">-</span>
            </span>
            権限: <span id="current-role-display" style="font-weight: bold;">閲覧専用</span>
        </div>
    </div>
    
    <div id="error-message-area" style="color: #ff4d4d; font-weight: bold; margin: 10px 0; min-height: 20px;"></div>
        
    <!-- 現在のBAN数表示エリア -->
    <div class="ban-counter">
        現在のBAN数:<span id="counter-number">0</span>人
    </div>

    <button class="reset-button" id="reset-btn">すべての BAN をリセット（RESET）</button>

    <!-- ゲーム画面全体のコンテナ -->
    <div class="game-screen">
        
        <!-- 上段エリア -->
        <div class="row-top">
            <!-- アサルト -->
            <div class="class-section">
                <div class="character-grid">
                    <div class="character-card"><img src="バンガロール.png" alt="バンガロール"></div>
                    <div class="character-card"><img src="レブナント.png" alt="レブナント"></div>
                    <div class="character-card"><img src="ヒューズ.png" alt="ヒューズ"></div>
                    <div class="character-card"><img src="マッドマギー.png" alt="マッドマギー"></div>
                    <div class="character-card"><img src="バリスティック.png" alt="バリスティック"></div>
                </div>
                <div class="class-title assault">▲ アサルト</div>
            </div>

            <!-- スカーミッシャー -->
            <div class="class-section">
                <div class="character-grid">
                    <div class="character-card"><img src="パスファインダー.png" alt="パスファインダー"></div>
                    <div class="character-card"><img src="レイス.png" alt="レイス"></div>
                    <div class="character-card"><img src="オクタン.png" alt="オクタン"></div>
                    <div class="character-card"><img src="ホライゾン.png" alt="ホライゾン"></div>
                    <div class="character-card"><img src="アッシュ.png" alt="アッシュ"></div>
                    <div class="character-card"><img src="オルター.png" alt="オルター"></div>
                    <div class="character-card"><img src="アクセル.png" alt="アクセル"></div>
                </div>
                <div class="class-title skirmisher">▼ スカーミッシャー</div>
            </div>
        </div>

        <!-- 下段エリア -->
        <div class="row-bottom">
            <!-- リコン -->
            <div class="class-section">
                <div class="character-grid">
                    <div class="character-card" ><img src="ブラッドハウンド.png" alt="ブラハ"></div>
                    <div class="character-card"><img src="クリプト.png" alt="クリプト"></div>
                    <div class="character-card"><img src="ヴァルキリー.png" alt="ヴァルキリ―"></div>
                    <div class="character-card"><img src="シア.png" alt="シア"></div>
                    <div class="character-card"><img src="ヴァンテージ.png" alt="ヴァンテージ"></div>
                    <div class="character-card"><img src="スパロー.png" alt="スパロー"></div>
                </div>
                <div class="class-title recon">👁 リコン</div>
            </div>

            <!-- サポート -->
            <div class="class-section">
                <div class="character-grid">
                    <div class="character-card"><img src="ジブラルタル.png" alt="ジブ"></div>
                    <div class="character-card"><img src="ライフライン.png" alt="ライフライン"></div>
                    <div class="character-card"><img src="ミラージュ.png" alt="ミラージュ"></div>
                    <div class="character-card"><img src="ローバ.png" alt="ローバ"></div>
                    <div class="character-card"><img src="ニューキャッスル.png" alt="ニューキャッスル"></div>
                    <div class="character-card"><img src="コンジット.png" alt="コンジット"></div>
                </div>
                <div class="class-title support">🛡 サポート</div>
            </div>

            <!-- コントローラー -->
            <div class="class-section">
                <div class="character-grid">
                    <div class="character-card"><img src="コースティック.png" alt="コースティック"></div>
                    <div class="character-card"><img src="ワットソン.png" alt="ワットソン"></div>
                    <div class="character-card"><img src="ランパート.png" alt="ランパート"></div>
                    <div class="character-card"><img src="カタリスト.png" alt="カタリスト"></div>
                </div>
                <div class="class-title controller">☖ コントローラー</div>
            </div>
        </div>

    </div>

   <!-- BANされた順番を表示するエリア -->
    <div class="ban-history-section">
        <div class="ban-history-title">▼ BANされた順番（BAN HISTORY）</div>
        <div class="ban-history-grid" id="ban-history-grid">
            <span class="empty-history-text">まだキャラクターはBANされていません</span>
        </div>
    </div>

    <!-- 免責事項エリア -->
    <footer class="footer">
        <p>免責事項：本サイトは個人によって作成された非公式のファンサイト（ツール）であり、Electronic Arts社およびRespawn Entertainment社とは一切関係がありません。<br>
        サイト内で使用されているゲーム画像の著作権および商標権は、それぞれの権利所有者に帰属します。</p>
    </footer>

    <script>
    // WebSocket通信用および部屋情報の変数
    let ws;
    let currentRoomId = null;
    let currentPassword = null;
    let isMaster = false;
    let banOrderList = [];

    // 💡 サーバー起動・接続監視用の変数
    let connectionTimeout; 
    const FALLBACK_SITE_URL = "https://github.io";

    // ページが読み込まれたら一度だけ実行
    document.addEventListener("DOMContentLoaded", function() {
        const cards = document.querySelectorAll('.character-card');
        cards.forEach(function(card) {
            card.addEventListener('click', function() {
                toggleBan(this);
            });
        });

        const resetBtn = document.getElementById('reset-btn');
        if (resetBtn) {
            resetBtn.addEventListener('click', function() {
                resetAllBans();
            });
        }

        // 自動的にサーバーへ接続を開始
        connectServer();
    });

    // 💡 画面上に安全にメッセージを表示する補助関数（alertの代わり）
    function setSystemMessage(text, isSuccess = false) {
        const errArea = document.getElementById("error-message-area");
        if (errArea) {
            errArea.textContent = text;
            errArea.style.color = isSuccess ? "#4dff88" : "#ff4d4d";
        } else {
            // 万が一エリアがない場合はコンソールに残す
            console.log(`[SYSTEM MESSAGE] ${text}`);
        }
    }

    // サーバーとの通信を確立する関数（Discordアクティビティ完全互換版）
    function connectServer() {
        let wsUrl = "wss://apex-ban-board-server.onrender.com";

        const isDiscordActivity = window.location.hostname.includes("discordsays.com") || 
                                  window.location.search.includes("instance_id") ||
                                  window.location.search.includes("frame_id");

        if (isDiscordActivity) {
            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            wsUrl = `${protocol}//${window.location.host}/.proxy/websocket-server`;
            console.log("🎮 Discordアクティビティ環境を検出。プロキシURL:", wsUrl);
        } else {
            console.log("🌐 通常のブラウザ環境を検出。直接接続します:", wsUrl);
        }

        try {
            ws = new WebSocket(wsUrl);
        } catch (error) {
            console.error("WebSocketの初期化に失敗しました:", error);
            setSystemMessage("通信の初期化に失敗しました。");
            return;
        }

        ws.onopen = function() {
            console.log("🟢 サーバーへの接続に成功しました。");
            setSystemMessage("サーバーに接続しました。部屋を作成するか、入室してください。", true);
        };

        ws.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                
                if (data.type === "ROOM_CREATED") {
                    currentRoomId = data.roomId;
                    currentPassword = data.password;
                    isMaster = true;
                    showActiveRoom("操作マスター");
                    // 💡 alertを廃止し、画面上部に案内を出す
                    setSystemMessage(`部屋を作成しました！ 部屋番号: ${data.roomId} / パスワード: ${data.password}`, true);
                } 
                else if (data.type === "ROOM_JOINED") {
                    currentRoomId = data.roomId;
                    currentPassword = data.inputPassword || currentPassword;
                    isMaster = data.isMaster;
                    showActiveRoom(isMaster ? "操作マスター" : "閲覧専用（観戦）");
                    
                    banOrderList = data.bannedLegends || [];
                    updateBanDisplay_Local();
                    setSystemMessage("部屋に入室しました。", true);
                }
                else if (data.type === "UPDATE_BAN_STATE") {
                    banOrderList = data.bannedLegends || [];
                    updateBanDisplay_Local();
                }
                else if (data.type === "ERROR") {
                    setSystemMessage(data.message);
                }
            } catch (e) {
                console.error("データ処理中にエラーが発生しました:", e);
            }
        };

        ws.onerror = function(error) {
            console.error("❌ WebSocketエラーが発生しました:", error);
            setSystemMessage("サーバーとの通信でエラーが発生しました。");
        };

        ws.onclose = function(event) {
            console.log(`🔴 サーバーとの通信が切断されました。コード: ${event.code}`);
            setSystemMessage("サーバーとの接続が切断されました。再読み込みしてください。");
        };
    }

    // サーバーの接続状態をチェックする補助関数
    function checkServerConnection() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            return true;
        }

        if (ws && ws.readyState === WebSocket.CONNECTING) {
            // 💡 アナウンスを画面表示に切り替え
            setSystemMessage("現在サーバーを起動中です(最大1分)。このままもうしばらくお待ちいただき、再度お試しください。");
            
            if (!connectionTimeout) {
                connectionTimeout = setTimeout(function() {
                    if (!ws || ws.readyState !== WebSocket.OPEN) {
                        // 💡 confirmによる強制移動ではなく、リンクボタン化して画面に表示する
                        setSystemMessage("1分以上経過しても起動しないため、オフライン版サイトをご利用ください。");
                        const errArea = document.getElementById("error-message-area");
                        if (errArea) {
                            errArea.innerHTML += ` <a href="${FALLBACK_SITE_URL}" target="_blank" style="color:#00ffff; text-decoration:underline;">[オフライン版を開く]</a>`;
                        }
                    }
                }, 60000); 
            }
            return false;
        }

        setSystemMessage("サーバーに接続されていません。再読み込みしてください。");
        connectServer(); 
        return false;
    }

    // 部屋作成リクエスト
    function createRoom() {
        if (!checkServerConnection()) return;
        ws.send(JSON.stringify({ type: "CREATE_ROOM" }));
    }

    // 部屋入室リクエスト
    function joinRoom() {
        if (!checkServerConnection()) return;
        const roomId = document.getElementById("join-room-id").value;
        const password = document.getElementById("join-room-pass").value;
        
        if (!roomId) {
            setSystemMessage("部屋番号を入力してください");
            return;
        }
        ws.send(JSON.stringify({ type: "JOIN_ROOM", roomId: roomId, password: password }));
    }

    // 部屋に入った後の画面表示切り替え
    function showActiveRoom(roleText) {
        document.getElementById("room-setup-view").style.display = "none";
        document.getElementById("room-active-view").style.display = "block";
        document.getElementById("current-room-display").textContent = currentRoomId;
        
        const passArea = document.getElementById("master-password-area");
        if (isMaster) {
            passArea.style.display = "inline"; 
            document.getElementById("current-pass-display").textContent = currentPassword;
        } else {
            passArea.style.display = "none"; 
        }
        
        const roleDisplay = document.getElementById("current-role-display");
        roleDisplay.textContent = roleText;
        roleDisplay.style.color = isMaster ? "#4dff88" : "#aaaaaa";
    }

    // クリックされた時の通信送信
    function toggleBan(element) {
        if (!currentRoomId) {
            // 💡 ここでもalertを廃止し、画面へのメッセージ書き換えにする
            setSystemMessage("最初に「部屋を作る」か「部屋に入る」を実行してください。");
            return;
        }

        if (!isMaster) return;
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            setSystemMessage("サーバーとの接続が切断されています。");
            return;
        }

        const imgElement = element.querySelector('img');
        const legendAlt = imgElement ? imgElement.getAttribute('alt') : element.innerText;

        ws.send(JSON.stringify({
            type: "TOGGLE_BAN",
            roomId: currentRoomId,
            password: currentPassword,
            legendAlt: legendAlt
        }));
    }

    // リセット送信
    function resetAllBans() {
        if (!currentRoomId || !isMaster) return;
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            setSystemMessage("サーバーとの接続が切断されています。");
            return;
        }

        ws.send(JSON.stringify({
            type: "RESET_BANS",
            roomId: currentRoomId,
            password: currentPassword
        }));
    }

    // データ描画ロジック
    function updateBanDisplay_Local() {
        const allCards = document.querySelectorAll('.character-card');
        allCards.forEach(card => card.classList.remove('banned'));

        document.getElementById('counter-number').textContent = banOrderList.length;

        const historyGrid = document.getElementById('ban-history-grid');
        if (!historyGrid) return;
        historyGrid.innerHTML = ''; 

        if (banOrderList.length === 0) {
            historyGrid.innerHTML = '<span class="empty-history-text">まだキャラクターはBANされていません</span>';
            return;
        }

        banOrderList.forEach((legend, index) => {
            if (legend.alt) {
                const targetCard = Array.from(allCards).find(card => {
                    const img = card.querySelector('img');
                    return img ? img.getAttribute('alt') === legend.alt : card.innerText === legend.alt;
                });
                if (targetCard) {
                    targetCard.classList.add('banned');
                }
            }

            const itemDiv = document.createElement('div');
            itemDiv.className = 'history-item';

            const numberBadge = document.createElement('div');
            numberBadge.className = 'history-number';
            numberBadge.textContent = index + 1;
            itemDiv.appendChild(numberBadge);

            if (legend.src) {
                const img = document.createElement('img');
                img.src = legend.src;
                img.alt = legend.alt || "";
                itemDiv.appendChild(img);
            } else {
                itemDiv.innerText = legend.alt || "??";
                itemDiv.style.display = 'flex';
                itemDiv.style.alignItems = 'center';
                itemDiv.style.justifyContent = 'center';
                itemDiv.style.fontSize = '10px';
            }
            historyGrid.appendChild(itemDiv);
        });
    }
    </script>
</body>
</html>
